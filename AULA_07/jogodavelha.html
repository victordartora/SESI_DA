<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Velha</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #tabuleiro {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            width: 300px;
            margin: 20px auto;
        }

        .casa {
            width: 100px;
            height: 100px;
            font-size: 40px;
            cursor: pointer;
            border: 1px solid black;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Jogo da Velha</h1>

    <h2 id="vez">Vez do jogador: X</h2>

    <div id="tabuleiro">
        <button class="casa" onclick="jogar(0)"></button>
        <button class="casa" onclick="jogar(1)"></button>
        <button class="casa" onclick="jogar(2)"></button>

        <button class="casa" onclick="jogar(3)"></button>
        <button class="casa" onclick="jogar(4)"></button>
        <button class="casa" onclick="jogar(5)"></button>

        <button class="casa" onclick="jogar(6)"></button>
        <button class="casa" onclick="jogar(7)"></button>
        <button class="casa" onclick="jogar(8)"></button>
    </div>

    <button onclick="reiniciar()">Reiniciar</button>

    <script>
        let jogador = "X";
        let tabuleiro = ["", "", "", "", "", "", "", ""];
        let jogoAcabou = false;

        function jogar(posicao) {

            if (tabuleiro[posicao] !== "" || jogoAcabou) {
                return;
            }

            tabuleiro[posicao] = jogador;

            document.getElementsByClassName("casa")[posicao].innerText = jogador;

            verificarVencedor();

            if (!jogoAcabou) {
                jogador = jogador === "X" ? "O" : "X";
                document.getElementById("vez").innerText =
                    "Vez do jogador: " + jogador;
            }
        }

        function verificarVencedor() {

            let vitorias = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            for (let combinacao of vitorias) {

                let [a, b, c] = combinacao;

                if (
                    tabuleiro[a] !== "" &&
                    tabuleiro[a] === tabuleiro[b] &&
                    tabuleiro[a] === tabuleiro[c]
                ) {
                    document.getElementById("vez").innerText =
                        "Jogador " + jogador + " venceu!";

                    jogoAcabou = true;
                    return;
                }
            }

            if (!tabuleiro.includes("")) {
                document.getElementById("vez").innerText = "Empate!";
                jogoAcabou = true;
            }
        }

        function reiniciar() {
            tabuleiro = ["", "", "", "", "", "", "", ""];
            jogador = "X";
            jogoAcabou = false;

            let casas = document.getElementsByClassName("casa");

            for (let casa of casas) {
                casa.innerText = "";
            }

            document.getElementById("vez").innerText =
                "Vez do jogador: X";
        }
    </script>

</body>
</html>
